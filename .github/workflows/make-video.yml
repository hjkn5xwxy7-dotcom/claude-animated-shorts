# Makes a finished short in the cloud: German narration (Piper) + word timings -> score / SFX / mix ->
# parallel software-WebGL render of the picture -> join + mux -> MP4 (artifact "video" + release when allowed).
# Start: Actions -> "Make video" -> Run workflow (once this file is on the default branch); until then a push that
# changes this file or the video's script.json on the studio branch runs it with the defaults.
name: Make video

on:
  push:
    branches: [claude/cloud-ai-animation-studio-aae6pa]
    paths: [.github/workflows/make-video.yml, studio/public/mond/script.json, studio/public/mann/script.json]
  workflow_dispatch:
    inputs:
      video:
        description: "Video folder under studio/public (script.json inside)"
        default: "mann"
      composition:
        description: "Remotion composition id"
        default: "MannShort"
      chunks:
        description: "Parallel render jobs (1-20)"
        default: "20"
      release:
        description: "Publish the MP4 as a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  VIDEO: ${{ inputs.video || 'mann' }}
  COMP: ${{ inputs.composition || 'MannShort' }}
  CHUNKS: ${{ inputs.chunks || '20' }}
  RELEASE: ${{ github.event_name == 'push' || inputs.release }}

defaults:
  run:
    working-directory: studio

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: studio/scripts/requirements-audio.txt
      - run: pip install -r scripts/requirements-audio.txt
      - name: Voice model cache
        uses: actions/cache@v4
        with:
          path: studio/models
          key: piper-${{ hashFiles(format('studio/public/{0}/script.json', env.VIDEO)) }}
          restore-keys: piper-
      - name: Narration + word timings
        run: python3 scripts/voice.py "public/$VIDEO/script.json" "public/$VIDEO"
      - name: Score, SFX and mix
        run: python3 "scripts/${VIDEO}_audio.py" "public/$VIDEO"
      - uses: actions/upload-artifact@v4
        with:
          name: audio
          path: |
            studio/public/${{ env.VIDEO }}/timing.json
            studio/public/${{ env.VIDEO }}/voice.wav
            studio/public/${{ env.VIDEO }}/mix.wav
          retention-days: 7

  plan:
    needs: audio
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: audio
          path: studio/public/${{ env.VIDEO }}
      - name: Browser libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxrandr2 libxkbcommon0 \
            libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 libasound2t64 > /dev/null
          npx remotion browser ensure
      - id: plan
        run: node scripts/plan-chunks.mjs

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: audio
          path: studio/public/${{ env.VIDEO }}
      - name: Browser libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxrandr2 libxkbcommon0 \
            libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 libasound2t64 > /dev/null
          npx remotion browser ensure
      - name: Render frames ${{ matrix.chunk.from }}-${{ matrix.chunk.to }}
        run: >
          node scripts/bench.mjs --comp "$COMP" --from ${{ matrix.chunk.from }} --to ${{ matrix.chunk.to }}
          --concurrency 2 --out "out/parts/part_${{ matrix.chunk.index }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk.index }}
          path: studio/out/parts/
          retention-days: 3

  join:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: studio/out/parts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: audio
          path: studio/public/${{ env.VIDEO }}
      - name: Join picture, add sound
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 scripts/join_parts.py out/parts "out/picture.mp4" >> "$GITHUB_STEP_SUMMARY"
          ffmpeg -v error -y -i out/picture.mp4 -i "public/$VIDEO/mix.wav" -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k \
            -shortest -movflags +faststart "out/$VIDEO.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of compact "out/$VIDEO.mp4" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: studio/out/${{ env.VIDEO }}.mp4
      - name: Publish release
        id: release
        if: env.RELEASE == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$VIDEO-${{ github.run_number }}"
          gh release create "$tag" "out/$VIDEO.mp4" --prerelease --target "${{ github.sha }}" \
            --title "$VIDEO #${{ github.run_number }}" --notes-file out/benchmark.md
          echo "Download: https://github.com/${{ github.repository }}/releases/download/$tag/$VIDEO.mp4" >> "$GITHUB_STEP_SUMMARY"
